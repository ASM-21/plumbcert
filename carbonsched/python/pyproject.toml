[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonsched"
version = "0.1.0"
description = "Carbon-aware scheduling with certified optimality"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
carbonsched = "carbonsched.__main__:main"

[tool.setuptools.packages.find]
include = ["carbonsched*"]
