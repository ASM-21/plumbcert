[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyapcert"
version = "0.1.0"
description = "Exact-rational Lyapunov stability certificate synthesis"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lyapcert = "lyapcert.__main__:main"

[tool.setuptools.packages.find]
include = ["lyapcert*"]
