[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimcert"
version = "0.1.0"
description = "Dimensional consistency checking for engineering formulas"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dimcert = "dimcert.__main__:main"

[tool.setuptools.packages.find]
include = ["dimcert*"]
